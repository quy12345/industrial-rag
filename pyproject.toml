[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-rag"
version = "0.1.0"
description = "Document ingestion preview scaffold for an industrial technical manual RAG system."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
]

[project.optional-dependencies]
retrieval = [
    "qdrant-client[fastembed]>= 1.19.0,<1.20.0",
    "fastembed==0.8.0",
    "onnxruntime==1.28.0",
]
ingestion = [
    "docling==2.117.0",
    "docling-core==2.90.0",
    "docling-ibm-models==3.13.3",
    "docling-parse==7.10.0",
    "huggingface-hub==1.26.0",
    "pypdfium2==5.12.1",
    "semchunk==3.2.5",
    "tokenizers==0.22.2",
    "transformers==5.14.1",
]
llm = [
    "langchain-core>=1.5.1,<1.6.0",
    "langchain-openai>=1.4.1,<1.5.0",
]
semantic-eval = [
    "ragas==0.4.3",
    "openai==2.53.0",
    # Ragas 0.4.3 imports the legacy VertexAI module removed in 0.4.x.
    "langchain-community==0.3.31",
]
ui = [
    "streamlit>=1.60,<1.61",
    "httpx>=0.27,<1.0",
]
dev = [
    "qdrant-client[fastembed]>=1.19.0,<1.20.0",
    "fastembed==0.8.0",
    "onnxruntime==1.28.0",
    "docling==2.117.0",
    "docling-core==2.90.0",
    "docling-ibm-models==3.13.3",
    "docling-parse==7.10.0",
    "huggingface-hub==1.26.0",
    "pypdfium2==5.12.1",
    "semchunk==3.2.5",
    "tokenizers==0.22.2",
    "transformers==5.14.1",
    "langchain-core>=1.5.1,<1.6.0",
    "langchain-openai>=1.4.1,<1.5.0",
    "streamlit>=1.60,<1.61",
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*", "ui*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
