[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-rag"
version = "0.1.0"
description = "Document ingestion preview scaffold for an industrial technical manual RAG system."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
]

[project.optional-dependencies]
retrieval = [
    "qdrant-client[fastembed]>=1.19.0,<1.20.0",
    "fastembed==0.8.0",
]
ingestion = [
    "docling>=2.117,<2.118",
]
llm = [
    "langchain-core>=1.5.1,<1.6.0",
    "langchain-openai>=1.4.1,<1.5.0",
]
ui = [
    "streamlit>=1.60,<1.61",
    "httpx>=0.27,<1.0",
]
dev = [
    "qdrant-client[fastembed]>=1.19.0,<1.20.0",
    "fastembed==0.8.0",
    "docling>=2.117,<2.118",
    "langchain-core>=1.5.1,<1.6.0",
    "langchain-openai>=1.4.1,<1.5.0",
    "streamlit>=1.60,<1.61",
    "pytest>=8.0,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "ui*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
