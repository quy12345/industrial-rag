services:
  api:
    image: industrial-rag-api:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant
      EMBEDDING_CACHE_DIR: /models/fastembed
      RETRIEVAL_PROFILE: phase7
    depends_on:
      - qdrant
    volumes:
      - fastembed_cache:/models/fastembed

  ui:
    image: industrial-rag-ui:local
    build:
      context: .
      dockerfile: Dockerfile
      target: ui
    ports:
      - "127.0.0.1:8501:8501"
    environment:
      RAG_API_URL: http://api:8000/api/v1
      RAG_API_TIMEOUT_SECONDS: "180"
      RAG_API_AUTH_TOKEN: ${API_AUTH_KEY:-}
    depends_on:
      api:
        condition: service_healthy

  ingestion:
    image: industrial-rag-ingestion:local
    build:
      context: .
      dockerfile: Dockerfile
      target: ingestion
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant
      EMBEDDING_CACHE_DIR: /models/fastembed
    depends_on:
      - qdrant
    volumes:
      - fastembed_cache:/models/fastembed
      - ./data/raw:/data/raw:ro
      - ./artifacts:/app/artifacts

  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
  fastembed_cache:
