services:
  api:
    image: industrial-rag-api:local
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant
      EMBEDDING_CACHE_DIR: /models/fastembed
    depends_on:
      - qdrant
    volumes:
      - fastembed_cache:/models/fastembed

  ingestion:
    image: industrial-rag-ingestion:local
    build:
      context: .
      dockerfile: Dockerfile
      target: ingestion
    profiles: ["tools"]
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant
      EMBEDDING_CACHE_DIR: /models/fastembed
    depends_on:
      - qdrant
    volumes:
      - fastembed_cache:/models/fastembed
      - ./data/raw:/data/raw:ro
      - ./artifacts:/app/artifacts

  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

volumes:
  qdrant_storage:
  fastembed_cache:
